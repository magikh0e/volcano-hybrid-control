# volcano.magikh0e.pl — standalone Volcano Hybrid Web BLE controller (PWA).
# Serves this repo's static app from its own docroot. Behind Cloudflare, same as
# the rest of magikh0e.pl. Drop in /etc/apache2/sites-available/ and enable with
# `a2ensite volcano.magikh0e.pl`. Full runbook in deploy/README.md.

<VirtualHost *:80>
    ServerName volcano.magikh0e.pl
    ServerAdmin magikh0e@gmail.com

    # Everything to HTTPS (mirrors the main-site vhost)
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =volcano.magikh0e.pl
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  ${APACHE_LOG_DIR}/volcano_error.log
    CustomLog ${APACHE_LOG_DIR}/volcano_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName volcano.magikh0e.pl
    ServerAdmin magikh0e@gmail.com
    DocumentRoot /var/www/volcano

    # Branded, noindex 404 page from the app repo instead of Apache's default.
    ErrorDocument 404 /404.html

    <Directory /var/www/volcano>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # If you deploy by cloning the repo into the docroot, never serve its
    # .git/ metadata (it would expose the full source history).
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>
    RedirectMatch 404 /\.git

    # --- security headers -------------------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set Referrer-Policy           "strict-origin"
    Header always set X-XSS-Protection          "1; mode=block"
    # Fully self-contained app — no third-party anything, no inline script/style.
    # (The Web Bluetooth API is not governed by CSP, so this does not affect
    # device control.)
    Header always set Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'"

    # --- PWA freshness ----------------------------------------------------
    # Keep the service worker + HTML shell revalidating so updates land; the
    # versioned SW cache (volcano-hybrid-control-vN) handles the rest.
    <FilesMatch "service-worker\.js$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(html|webmanifest)$">
        Header set Cache-Control "no-cache, max-age=300"
    </FilesMatch>

    # --- TLS --------------------------------------------------------------
    # ⚠ The cert files below MUST already exist before you enable this vhost.
    #   A missing SSLCertificateFile makes `apache2ctl configtest` fail for EVERY
    #   site (Apache won't reload, and `certbot` can't run). Get the cert first —
    #   see deploy/README.md step 3.
    SSLEngine on
    # (a) Cloudflare Origin Certificate — recommended, since you're behind
    #     Cloudflare: no ACME challenge to route through the proxy. Create it in
    #     the CF dashboard, save the pair here, keep the subdomain proxied, and
    #     set the zone's SSL/TLS mode to Full (strict).
    SSLCertificateFile    /etc/ssl/cloudflare/volcano.magikh0e.pl.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/volcano.magikh0e.pl.key
    # (b) …or Let's Encrypt (see README for the behind-Cloudflare caveats). Do NOT
    #     pre-write these lines and then run `certbot --apache` — either let
    #     certbot generate its own -le-ssl vhost, or obtain the cert first with
    #     `certbot certonly` and only then point these lines at it:
    # SSLCertificateFile    /etc/letsencrypt/live/volcano.magikh0e.pl/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/volcano.magikh0e.pl/privkey.pem
    # Include               /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog  ${APACHE_LOG_DIR}/volcano_error.log
    CustomLog ${APACHE_LOG_DIR}/volcano_access.log combined
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
