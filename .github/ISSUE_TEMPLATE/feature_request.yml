name: Feature idea
description: Something the app could do, or do better.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help with?
      description: The situation where you'd use it. This often matters more than the exact solution.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - Control and the Volcano drawing
        - Workflows and templates
        - Session history and notes
        - Temperature graph
        - Notifications or sounds
        - Demo
        - Console
        - Settings and themes
        - Something new
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Sketches, screenshots, or how another app does it.
